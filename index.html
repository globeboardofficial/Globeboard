<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globeboard</title>
<meta name="description" content="Globeboard: dünya küresi üzerinde ülke veya şehir seçip reklam alanı kiralayın. Aylık veya yıllık reklam ver.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Düzen: solda dönen küre (masaüstünde yapışkan), sağda seçilen bölgenin kiralama paneli. Telefonda alt alta. */
:root {
  --bg: #FFFFFF;
  --surface: #F4F7F9;
  --ink: #12212C;
  --muted: #566874;
  --line: #C5D1D9;
  --ocean: #B9D3E4;
  --grid: rgba(18, 33, 44, .12);
  --land: #F4F7F5;
  --landline: #8AA4B5;
  --accent: #C2410C;
  --accent-ink: #FFFFFF;
  --avail: #0F766E;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* Tek açık tema: Globeboard her zaman beyaz zeminde kalır. */
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 5vw, 42px); font-weight: 800; line-height: 1; letter-spacing: -.03em; display: flex; align-items: center; gap: 10px; }
h2 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mark { width: 1em; height: 1em; flex: none; }

header { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
.lead { max-width: 52ch; color: var(--muted); margin-top: 10px; }
.tools-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.search, .langsel { display: flex; flex-direction: column; gap: 4px; }
.search { min-width: min(100%, 260px); }
.search label, .langsel label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.search input, .langsel select { height: 42px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 12px; width: 100%; }
.notice { font-family: var(--font-mono); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 8px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; }
  .stage-col { position: sticky; top: 16px; }
}
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#globe { display: block; width: 100%; aspect-ratio: 1 / 1; max-height: 78vh; touch-action: pan-y; cursor: grab; }
#globe.hit { cursor: pointer; }
#globe.drag { cursor: grabbing; }
.tools { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.tools button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; }
.tools button:hover { border-color: var(--accent); }
#tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 5px 9px; border-radius: 4px; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; transform: translate(12px, -34px); }
#stage-msg { position: absolute; inset: auto 12px 12px 12px; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend em { font-style: normal; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--landline); background: var(--land); }
.sw.rent { background: linear-gradient(135deg, #1D4ED8 50%, #15803D 50%); border-color: transparent; }
.sw.sel { background: transparent; border: 2px solid var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.reg-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.pill { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid currentColor; }
.pill.free { color: var(--avail); }
.pill.taken { color: var(--accent); }
.pill.review { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip small { font-family: var(--font-mono); color: var(--muted); margin-inline-start: 6px; }
.suggest { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
.sec { display: flex; flex-direction: column; gap: 10px; }

.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.plan { text-align: start; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.plan[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.plan-name { font-size: 13px; color: var(--muted); }
.plan-price { font-family: var(--font-mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.plan-sub { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper > span { color: var(--muted); font-size: 14px; margin-inline-end: auto; }
.stepper button { width: 38px; height: 38px; border: 1px solid var(--line); background: transparent; border-radius: 6px; cursor: pointer; font-size: 18px; }
.stepper button:hover { border-color: var(--accent); }
.stepper output { min-width: 84px; text-align: center; font-family: var(--font-mono); }

.fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input[type="text"], .field input[type="url"], .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 9px 11px; width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 64px; }
.field input[type="file"] { font-size: 13px; max-width: 100%; }
.colors { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.colors input[type="color"] { width: 42px; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; }
.preset { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.rules { font-size: 13px; color: var(--muted); border-inline-start: 3px solid var(--line); padding-inline-start: 10px; }
.check { display: flex; align-items: start; gap: 10px; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }

.ad { border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ad img { display: block; width: 100%; max-height: 180px; object-fit: cover; }
.ad-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.ad-brand { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.ad-head { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.ad-text { font-size: 14px; opacity: .92; overflow-wrap: anywhere; }
.ad-link { font-size: 13px; font-weight: 600; text-decoration: underline; color: inherit; width: fit-content; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin: 0; }
.meta dt { font-size: 12px; color: var(--muted); }
.meta dd { margin: 0; font-weight: 600; }
.quote { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; flex-wrap: wrap; }
.quote .total { font-family: var(--font-mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.quote .until { font-size: 13px; color: var(--muted); }
.cta { height: 46px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 16px; cursor: pointer; padding-inline: 16px; }
.cta:hover { filter: brightness(1.08); }
.cta.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.err { color: var(--accent); font-size: 13px; min-height: 1em; }
.fine { font-size: 12px; color: var(--muted); }

.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--font-mono); width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: 14px; }

.list-sec { display: flex; flex-direction: column; gap: 10px; }
.rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 10px; align-items: center; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.row:hover { border-color: var(--accent); }
.dot { width: 14px; height: 14px; border-radius: 50%; }
.row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.foot { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--muted); }
.foot .mailrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.foot a { color: var(--ink); font-weight: 600; overflow-wrap: anywhere; }
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

.land { gap: 36px; }
.land section { display: flex; flex-direction: column; gap: 12px; }
.land-top { display: flex; justify-content: flex-end; }
.hero { align-items: flex-start; padding-block: 8px 4px; gap: 16px; }
h1.brand { font-size: clamp(44px, 9vw, 68px); letter-spacing: -.035em; gap: 14px; }
.hero-lead { max-width: 46ch; font-size: 18px; color: var(--muted); }
.hero .cta { padding-inline: 22px; }
.steps.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl { min-width: 440px; display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: 28px minmax(0, 1fr) 84px 84px; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
.tr:first-child { border-top: 0; }
.tr.th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface); }
.tn { font-family: var(--font-mono); color: var(--muted); }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: end; }
.clauses { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
.clause { border-top: 2px solid var(--ink); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.clause h3 { color: var(--ink); }
.accept { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; gap: 14px; }
.until.wide { flex-basis: 100%; }
</style>

</head>
<body>
<div class="wrap land" id="landing">
  <div class="land-top">
    <div class="langsel">
      <label for="lang0" data-i18n="langL"></label>
      <select id="lang0"></select>
    </div>
  </div>
  <section class="hero">
    <h1 class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="16" cy="16" rx="6" ry="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 16h25" stroke="currentColor" stroke-width="2"/><circle cx="22.5" cy="9.5" r="3.4" fill="var(--accent)"/></svg>
      Globeboard
    </h1>
    <p class="hero-lead" data-i18n="lead"></p>
    <button type="button" class="cta" id="heroCta" data-i18n="heroCta"></button>
  </section>
  <section aria-labelledby="howh">
    <h3 id="howh" data-i18n="howH"></h3>
    <ol class="steps cols" id="how"></ol>
  </section>
  <section id="plans" aria-labelledby="plansh">
    <h3 id="plansh" data-i18n="plansH"></h3>
    <p data-i18n="plansD"></p>
    <div class="tblwrap"><div class="tbl" id="plantbl"></div></div>
    <p class="fine" data-i18n="cityNote"></p>
    <p class="fine" id="minall"></p>
    <p class="fine" data-i18n="curAll"></p>
  </section>
  <section id="terms" aria-labelledby="termsh">
    <h3 id="termsh" data-i18n="termsH"></h3>
    <div class="clauses" id="clauses"></div>
    <p class="fine" data-i18n="draftNote"></p>
  </section>
  <section class="accept">
    <label class="check" for="a1"><input id="a1" type="checkbox"><span data-i18n="accept1"></span></label>
    <label class="check" for="a2"><input id="a2" type="checkbox"><span data-i18n="accept2"></span></label>
    <p class="err" id="aerr" role="alert"></p>
    <button type="button" class="cta" id="go" data-i18n="goBtn"></button>
  </section>
  <footer class="foot">
    <p data-i18n="disc"></p>
    <p class="mailrow"><span data-i18n="contact"></span>: <a id="mail2" href="mailto:globeboard.official@gmail.com">globeboard.official@gmail.com</a> <button type="button" class="chip" data-i18n="copy"></button></p>
    <p data-i18n="noData"></p>
  </footer>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="2.4"/><ellipse cx="16" cy="16" rx="6" ry="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 16h25" stroke="currentColor" stroke-width="2"/><circle cx="22.5" cy="9.5" r="3.4" fill="var(--accent)"/></svg>
        Globeboard
      </h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="tools-top">
      <button type="button" class="chip" id="toLanding" data-i18n="navTerms"></button>
      <div class="langsel">
        <label for="lang" data-i18n="langL"></label>
        <select id="lang"></select>
      </div>
      <div class="search">
        <label for="search" data-i18n="searchL"></label>
        <input id="search" type="text" list="places" data-i18n-ph="searchP" autocomplete="off">
        <datalist id="places"></datalist>
      </div>
    </div>
  </header>
  <p class="notice" data-i18n="notice"></p>

  <div class="layout">
    <div class="stage-col">
      <div class="stage" id="stage">
        <canvas id="globe" role="img" data-i18n-aria="globeAria"></canvas>
        <div class="tools">
          <button type="button" id="zin" data-i18n-aria="zin">+</button>
          <button type="button" id="zout" data-i18n-aria="zout">−</button>
          <button type="button" id="spin" aria-pressed="true">⟳</button>
        </div>
        <div id="tip" hidden></div>
        <div id="stage-msg" hidden></div>
      </div>
      <div class="legend">
        <span><i class="sw"></i><em data-i18n="lgFree"></em></span>
        <span><i class="sw rent"></i><em data-i18n="lgRent"></em></span>
        <span><i class="sw sel"></i><em data-i18n="lgSel"></em></span>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="list-sec" aria-labelledby="rt">
    <h3 id="rt" data-i18n="rentedH"></h3>
    <div class="rows" id="rows"></div>
  </section>

  <footer class="foot">
    <p data-i18n="disc"></p>
    <p class="mailrow"><span data-i18n="contact"></span>: <a id="mail" href="mailto:globeboard.official@gmail.com">globeboard.official@gmail.com</a> <button type="button" class="chip" id="copymail" data-i18n="copy"></button></p>
    <p data-i18n="noData"></p>
  </footer>
</div>
<div id="toast" role="status"></div>

  function adCard(a) {
    var fg = onColor(a.color), link = safeLink(a.link);
    return '<div class="ad" style="background:' + esc(a.color) + ';color:' + fg + '">' +
      (a.image ? '<img src="' + esc(a.image) + '" alt="">' : '') +
      '<div class="ad-body"><span class="ad-brand">' + esc(a.brand || t('phBrand')) + '</span>' +
      '<span class="ad-head">' + esc(a.headline || t('phHead')) + '</span>' +
      (a.body ? '<span class="ad-text">' + esc(a.body) + '</span>' : '') +
      (link ? '<a class="ad-link" href="' + esc(link) + '" target="_blank" rel="noopener noreferrer">' + esc(t('more')) + '</a>' : '') +
      '</div></div>';
  }
  function introHTML() {
    return '<div><p class="eyebrow">' + esc(t('introK')) + '</p><h2>' + esc(t('introH')) + '</h2></div>' +
      '<ol class="steps"><li><div><b>' + esc(t('s1h')) + '</b><span>' + esc(t('s1d')) + '</span></div></li>' +
      '<li><div><b>' + esc(t('s2h')) + '</b><span>' + esc(t('s2d')) + '</span></div></li>' +
      '<li><div><b>' + esc(t('s3h')) + '</b><span>' + esc(t('s3d')) + '</span></div></li></ol>' +
      '<p class="fine">' + esc(t('count', { c: features.length, y: CITIES.length })) + '</p>';
  }
  function quoteHTML(r) {
    var until = addMonths(new Date(), months(state.plan, state.qty));
    return '<span class="total">' + esc(moneyC(total(r, state.plan, state.qty), curOf(r))) + '</span>' +
      '<span class="until">' + esc(unit(state.qty, state.plan === 'year' ? 'year' : 'month')) + ' · ' + esc(t('ends')) + ' ' + esc(DF.format(until)) + '</span>' +
      '<span class="until wide">' + esc(t('remindL')) + ': ' + esc(DF.format(remindDate(state.plan, until))) + '</span>';
  }
  function renderPanel() {
    var el = $('#panel');
    if (!state.sel) { el.innerHTML = introHTML(); return; }
    var r = regions.get(state.sel), rent = rentals[state.sel], d = state.draft;
    var parent = r.type === 'city' ? regions.get('c:' + r.cc) : null;
    var pillCls = !rent ? 'free' : rent.status === 'live' ? 'taken' : 'review';
    var pillTxt = !rent ? t('free') : rent.status === 'live' ? t('taken') : t('review');
    var h = '<div class="reg-head"><div><p class="eyebrow">' + esc(r.type === 'city' ? t('city') : t('country')) + (parent ? ' · ' + esc(nameOf(parent)) : '') + '</p><h2>' + esc(nameOf(r)) + '</h2></div>' +
      '<span class="pill ' + pillCls + '">' + esc(pillTxt) + '</span></div>';
    var cl = CC_LANG[r.type === 'city' ? r.cc : r.id];
    if (cl && cl !== lang) {
      h += '<div class="suggest"><span>' + esc(t('suggest', { l: LANG_NAMES[cl] })) + '</span><button type="button" class="chip" data-action="lang" data-lang="' + cl + '">' + esc(t('suggestBtn', { l: LANG_NAMES[cl] })) + '</button></div>';
    }
    if (r.type === 'country') {
      var cs = CITIES.filter(function (c) { return c.cc === r.id; });
      if (cs.length) {
        h += '<div class="sec"><h3>' + esc(t('cities')) + '</h3><div class="chips">' + cs.map(function (c) {
          var cr = regions.get('y:' + c.id);
          return '<button type="button" class="chip" data-action="pick" data-key="y:' + c.id + '">' + esc(nameOf(cr)) + '<small>' + (rentals['y:' + c.id] ? esc(t('taken')) : esc(moneyC(unitLocal(cr), curOf(cr)))) + '</small></button>';
        }).join('') + '</div></div>';
      }
    } else if (parent) {
      h += '<div class="chips"><button type="button" class="chip" data-action="pick" data-key="' + parent.key + '">' + esc(t('toCountry', { n: nameOf(parent) })) + '</button></div>';
    }
    if (rent) {
      h += '<div class="sec"><h3>' + esc(t('liveAd')) + '</h3>' + adCard(rent) + '</div>' +
        '<dl class="meta"><div><dt>' + esc(t('advertiser')) + '</dt><dd>' + esc(rent.brand) + '</dd></div>' +
        '<div><dt>' + esc(t('plan')) + '</dt><dd>' + esc(unit(rent.qty, rent.plan === 'year' ? 'year' : 'month')) + '</dd></div>' +
        '<div><dt>' + esc(t('ends')) + '</dt><dd>' + esc(DF.format(new Date(rent.until))) + '</dd></div>' +
        (rent.email ? '<div><dt>' + esc(t('remindL')) + '</dt><dd>' + esc(DF.format(remindDate(rent.plan, new Date(rent.until)))) + '</dd></div>' : '') + '</dl>';
      if (rent.example) h += '<p class="fine">' + esc(t('example')) + '</p>';
      else {
        if (rent.status !== 'live') {
          h += '<p class="rules">' + esc(t('rvNote')) + '</p><button type="button" class="cta ghost" data-action="approve">' + esc(t('approve')) + '</button>';
        }
        h += '<button type="button" class="cta ghost" data-action="release">' + esc(t('endIt')) + '</button>';
      }
      el.innerHTML = h; return;
    }
    h += '<div class="sec"><h3>' + esc(t('period')) + '</h3><div class="plans" role="group" aria-label="' + esc(t('period')) + '">' +
      '<button type="button" class="plan" data-action="plan" data-plan="month" aria-pressed="' + (state.plan === 'month') + '"><span class="plan-name">' + esc(t('monthly')) + '</span><span class="plan-price">' + esc(moneyC(unitLocal(r), curOf(r))) + '</span><span class="plan-sub">' + esc(t('perMonth')) + '</span></button>' +
      '<button type="button" class="plan" data-action="plan" data-plan="year" aria-pressed="' + (state.plan === 'year') + '"><span class="plan-name">' + esc(t('yearly')) + '</span><span class="plan-price">' + esc(moneyC(Math.round(unitLocal(r) * 10 * 100) / 100, curOf(r))) + '</span><span class="plan-sub">' + esc(t('perYear')) + '</span></button></div>' +
      '<div class="stepper"><span>' + esc(t('duration')) + '</span><button type="button" data-action="dec" aria-label="−">−</button><output>' + esc(unit(state.qty, state.plan === 'year' ? 'year' : 'month')) + '</output><button type="button" data-action="inc" aria-label="+">+</button></div>' +
      (state.plan === 'month' && minQty(r, 'month') > 1 ? '<p class="fine">' + esc(t('minNote', { m: moneyC(toLocal(MIN_ORDER, curOf(r)), curOf(r)), n: unit(minQty(r, 'month'), 'month') })) + '</p>' : '') +
      '<p class="fine">' + esc(t('curNote', { c: curName(curOf(r)) })) + '</p></div>';
    h += '<div class="sec"><h3>' + esc(t('yourAd')) + '</h3><div class="fields">' +
      '<div class="field"><label for="f-brand">' + esc(t('brand')) + '</label><input id="f-brand" type="text" maxlength="28" value="' + esc(d.brand) + '"></div>' +
      '<div class="field"><label for="f-headline">' + esc(t('headline')) + '</label><input id="f-headline" type="text" maxlength="40" value="' + esc(d.headline) + '"></div>' +
      '<div class="field"><label for="f-body">' + esc(t('text')) + '</label><textarea id="f-body" maxlength="90">' + esc(d.body) + '</textarea></div>' +
      '<div class="field"><label for="f-color">' + esc(t('color')) + '</label><div class="colors"><input id="f-color" type="color" value="' + esc(d.color) + '">' +
      PRESETS.map(function (c) { return '<button type="button" class="preset" data-action="preset" data-color="' + c + '" style="background:' + c + '" aria-label="' + c + '"></button>'; }).join('') + '</div></div>' +
      '<div class="field"><label for="f-link">' + esc(t('link')) + '</label><input id="f-link" type="url" placeholder="https://" value="' + esc(d.link) + '"></div>' +
      '<div class="field"><label for="f-image">' + esc(t('image')) + '</label><input id="f-image" type="file" accept="image/*"></div>' +
      '<div class="field"><label for="f-email">' + esc(t('emailL')) + '</label><input id="f-email" type="email" autocomplete="email" value="' + esc(d.email) + '"></div>' +
      '</div></div>';
    h += '<div class="sec"><h3>' + esc(t('preview')) + '</h3><div id="preview">' + adCard(d) + '</div></div>' +
      '<p class="rules">' + esc(t('rulesT')) + '</p>' +
      '<label class="check" for="f-rules"><input id="f-rules" type="checkbox"' + (d.rules ? ' checked' : '') + '><span>' + esc(t('rulesOk')) + '</span></label>' +
      '<div class="quote" id="quote">' + quoteHTML(r) + '</div>' +
      '<p class="err" id="err" role="alert">' + esc(state.err) + '</p>' +
      '<button type="button" class="cta" data-action="rent">' + esc(t('rentBtn')) + '</button>' +
      '<p class="fine">' + esc(t('proto')) + '</p>';
    el.innerHTML = h;
  }
  function renderList() {
    var keys = Object.keys(rentals);
    $('#rows').innerHTML = keys.map(function (k) {
      var r = regions.get(k), a = rentals[k];
      return '<button type="button" class="row" data-action="pick" data-key="' + k + '"><i class="dot" style="background:' + esc(a.color) + '"></i><span style="min-width:0"><b>' + esc(nameOf(r)) + '</b><small>' + esc(a.brand) + ' · ' + esc(r.type === 'city' ? t('city') : t('country')) + ' · ' + esc(a.status === 'live' ? DF.format(new Date(a.until)) : t('review')) + '</small></span></button>';
    }).join('') || '<p class="fine">' + esc(t('noRent')) + '</p>';
  }
  function selectRegion(key, doFocus) {
    var r = regions.get(key); if (!r) return;
    state.sel = key; state.plan = 'month'; state.qty = minQty(r, 'month'); state.draft = freshDraft(); state.err = '';
    setAuto(false); renderPanel(); dirty = true;
    if (doFocus) focusOn(r.lon, r.lat, r.zoom);
    if (window.innerWidth < 900) { $('#panel').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); }
  }
  function setErr(msg) { state.err = msg; var e = $('#err'); if (e) e.textContent = msg; }

  var panel = $('#panel');
  function updatePreview() { var pv = $('#preview'); if (pv) pv.innerHTML = adCard(state.draft); }
  panel.addEventListener('input', function (e) {
    if (e.target.id === 'f-rules') { state.draft.rules = e.target.checked; return; }
    var map = { 'f-brand': 'brand', 'f-headline': 'headline', 'f-body': 'body', 'f-color': 'color', 'f-link': 'link', 'f-email': 'email' };
    var k = map[e.target.id]; if (!k) return;
    state.draft[k] = e.target.value; updatePreview();
  });
  panel.addEventListener('change', function (e) {
    if (e.target.id === 'f-rules') { state.draft.rules = e.target.checked; return; }
    if (e.target.id !== 'f-image') return;
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 480 / img.width), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        state.draft.image = c.toDataURL('image/jpeg', 0.8); updatePreview();
      };
      img.onerror = function () { setErr(t('eImg')); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  panel.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]'); if (!b) return;
    var a = b.dataset.action, r = state.sel ? regions.get(state.sel) : null;
    if (a === 'pick') { selectRegion(b.dataset.key, true); return; }
    if (a === 'lang') { setLang(b.dataset.lang, true); return; }
    if (!r) return;
    if (a === 'plan') { state.plan = b.dataset.plan; state.qty = minQty(r, state.plan); renderPanel(); }
    else if (a === 'inc') { state.qty = Math.min(state.plan === 'year' ? 3 : 12, state.qty + 1); renderPanel(); }
    else if (a === 'dec') { state.qty = Math.max(minQty(r, state.plan), state.qty - 1); renderPanel(); }
    else if (a === 'preset') { state.draft.color = b.dataset.color; renderPanel(); }
    else if (a === 'release') { delete rentals[state.sel]; persist(); renderPanel(); renderList(); dirty = true; toast(t('tEnd', { r: nameOf(r) })); }
    else if (a === 'approve') { rentals[state.sel].status = 'live'; persist(); renderPanel(); renderList(); dirty = true; toast(t('tApprove', { r: nameOf(r) })); }
    else if (a === 'rent') {
      var d = state.draft;
      if (!d.brand.trim() || !d.headline.trim()) { setErr(t('eReq')); return; }
      if (d.link && !safeLink(d.link)) { setErr(t('eLink')); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) { setErr(t('eMail')); return; }
      if (!d.rules) { setErr(t('eRules')); return; }
      rentals[state.sel] = { brand: d.brand.trim(), headline: d.headline.trim(), body: d.body.trim(), color: d.color, link: d.link.trim(), image: d.image, email: d.email.trim(), plan: state.plan, qty: state.qty, until: addMonths(new Date(), months(state.plan, state.qty)).toISOString(), status: 'review', example: false };
      persist(); renderPanel(); renderList(); dirty = true;
      toast(t('tReview', { r: nameOf(r) }));
    }
  });
  $('#rows').addEventListener('click', function (e) {
    var b = e.target.closest('[data-action="pick"]'); if (b) selectRegion(b.dataset.key, true);
  });

  /* arama */
  var lookup = new Map();
  function buildSearch() {
    lookup = new Map(); var opts = [];
    regions.forEach(function (r) {
      var n = nameOf(r);
      lookup.set(n.toLocaleLowerCase(lang), r.key); lookup.set(r.en.toLocaleLowerCase(lang), r.key);
      opts.push('<option value="' + esc(n) + '">');
    });
    $('#places').innerHTML = opts.join('');
  }
  function doSearch() {
    var v = $('#search').value.trim().toLocaleLowerCase(lang);
    var k = lookup.get(v);
    if (k) selectRegion(k, true);
  }
  $('#search').addEventListener('change', doSearch);
  $('#search').addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });

  /* e-posta kopyala */
  document.querySelectorAll('.mailrow button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var a = btn.parentNode.querySelector('a');
      function fallback() {
        var rg = document.createRange(); rg.selectNodeContents(a);
        var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
      }
      try {
        navigator.clipboard.writeText(a.textContent).then(function () { toast(t('copied')); }, fallback);
      } catch (err) { fallback(); }
    });
  });

  /* dil */
  function applyStatic() {
    document.querySelectorAll('[data-i18n]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (n) { n.placeholder = t(n.getAttribute('data-i18n-ph')); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-i18n-aria'))); });
  }
  function setLang(l, remember) {
    if (!I18N[l]) l = 'en';
    lang = l;
    document.documentElement.lang = l;
    $('#landing').dir = $('#app').dir = l === 'ar' ? 'rtl' : 'ltr';
    NF = new Intl.NumberFormat(l, { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
    NF2 = new Intl.NumberFormat(l, { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
    DF = new Intl.DateTimeFormat(l, { day: 'numeric', month: 'short', year: 'numeric' });
    try { DN = new Intl.DisplayNames([l], { type: 'region' }); } catch (e) { DN = null; }
    $('#lang').value = l; $('#lang0').value = l;
    if (remember) { try { localStorage.setItem(LSTORE, l); } catch (e) { /* kaydedilemedi */ } }
    applyStatic(); setAuto(auto); buildSearch(); renderPanel(); renderList(); renderLanding(); dirty = true;
    var m = $('#stage-msg'); if (!worldOk) { m.hidden = false; m.textContent = t('mapFail'); }
  }
  function detectLang() {
    try { var s = localStorage.getItem(LSTORE); if (s && I18N[s]) return s; } catch (e) { /* yok say */ }
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < list.length; i++) { var p = String(list[i]).toLowerCase().split('-')[0]; if (I18N[p]) return p; }
    return 'en';
  }
  ['#lang', '#lang0'].forEach(function (sel) {
    $(sel).innerHTML = LANGS.map(function (l) { return '<option value="' + l[0] + '">' + esc(l[1]) + '</option>'; }).join('');
    $(sel).addEventListener('change', function (e) { setLang(e.target.value, true); });
  });

  /* açılış sayfası */
  var TIER_EX = [['USA', 'DEU', 'JPN'], ['GRC', 'POL', 'CHL'], ['CHN', 'BRA', 'TUR'], ['IND', 'EGY', 'VNM'], ['AFG', 'ETH', 'HTI']];
  function cname(id) {
    var a = A2[id];
    if (a && DN) { try { return DN.of(a); } catch (e) { /* kodu göster */ } }
    return id;
  }
  function renderLanding() {
    $('#how').innerHTML = [1, 2, 3].map(function (i) {
      return '<li><div><b>' + esc(t('s' + i + 'h')) + '</b><span>' + esc(t('s' + i + 'd')) + '</span></div></li>';
    }).join('');
    $('#plantbl').innerHTML = '<div class="tr th"><span></span><span>' + esc(t('colEx')) + '</span><span class="num">' + esc(t('monthly')) + '</span><span class="num">' + esc(t('yearly')) + '</span></div>' +
      TIER_EX.map(function (ids, i) {
        var p = TIER_PRICE[i + 1];
        return '<div class="tr"><span class="tn">' + (i + 1) + '</span><span>' + esc(ids.map(cname).join(', ')) + '</span><span class="num">' + esc(money(p)) + '</span><span class="num">' + esc(money(p * 10)) + '</span></div>';
      }).join('');
    $('#minall').textContent = t('minAll', { m: money(MIN_ORDER) });
    $('#clauses').innerHTML = [1, 2, 3, 4, 5].map(function (i) {
      return '<div class="clause"><h3>' + esc(t('c' + i + 'h')) + '</h3><p>' + esc(t('c' + i + 'd')) + '</p></div>';
    }).join('');
  }
  function showApp() { $('#landing').hidden = true; $('#app').hidden = false; window.scrollTo(0, 0); resize(); dirty = true; }
  function showLanding() { $('#app').hidden = true; $('#landing').hidden = false; window.scrollTo(0, 0); }
  $('#go').addEventListener('click', function () {
    if (!$('#a1').checked || !$('#a2').checked) { $('#aerr').textContent = t('eAccept'); return; }
    $('#aerr').textContent = ''; showApp();
  });
  $('#toLanding').addEventListener('click', showLanding);
  $('#heroCta').addEventListener('click', function () { $('#plans').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); });

  /* başlangıç */
  loadColors(); resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(cv); else window.addEventListener('resize', resize);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', loadColors);
  new MutationObserver(loadColors).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  setLang(detectLang(), false);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
