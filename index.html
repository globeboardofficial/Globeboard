<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeBoard - Küresel Sanal Arsa Platformu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #info-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 90%;
            width: 340px;
            display: none;
            backdrop-filter: blur(12px);
        }
        #info-card h3 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.2rem; }
        #info-card .status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 10px; }
        #info-card .status.available { background: #166534; color: #4ade80; }
        #info-card .status.taken { background: #991b1b; color: #fca5a5; }
        #info-card p { margin: 0 0 14px 0; font-size: 0.9rem; color: #cbd5e1; line-height: 1.4; }
        #info-card button {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        #info-card button:active { transform: scale(0.98); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-card">
        <h3 id="card-title">Sanal Arsa</h3>
        <div id="card-status" class="status available">Müsait</div>
        <p id="card-desc">Arsa detayları burada görünecektir.</p>
        <button id="card-btn" onclick="contactParcel()">Bu Arsayı İncele / Kirala</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 240;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Dünya Küresi
        const geometry = new THREE.SphereGeometry(80, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const material = new THREE.MeshPhongMaterial({ map: earthTexture });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Genişletilmiş Arsa Listesi (Yeşil = Müsait, Kırmızı = Dolu)
        const pins = [];
        const pinLocations = [
            { lat: 38.4237, lon: 27.1428, title: "İzmir Kordon Parseli", desc: "Ege'nin incisinde yüksek görünürlüklü sanal reklam alanı.", status: "müsait", price: "50 USD / Ay" },
            { lat: 41.0082, lon: 28.9784, title: "İstanbul Boğaz Parseli", desc: "Kıtaların buluştuğu noktada küresel vitrin.", status: "dolu", price: "Kiralanmış" },
            { lat: 39.9334, lon: 32.8597, title: "Ankara Başkent Parseli", desc: "Merkezi reklam ve marka tanıtım noktası.", status: "müsait", price: "40 USD / Ay" },
            { lat: 40.7128, lon: -74.0060, title: "New York Times Square", desc: "Dünyanın finans ve medya merkezinde elit arsa.", status: "dolu", price: "Kiralanmış" },
            { lat: 51.5074, lon: -0.1278, title: "Londra Merkez Parseli", desc: "Avrupa'nın finans kalbinde reklam alanı.", status: "müsait", price: "60 USD / Ay" },
            { lat: 35.6762, lon: 139.6503, title: "Tokyo Shibuya Parseli", desc: "Asya'nın yüksek teknolojili reklam bölgesi.", status: "dolu", price: "Kiralanmış" }
        ];

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        pinLocations.forEach(loc => {
            const pinGeo = new THREE.SphereGeometry(2.2, 16, 16);
            // Müsaitse Yeşil (0x22c55e), Doluysa Kırmızı (0xef4444)
            const colorHex = loc.status === "müsait" ? 0x22c55e : 0xef4444;
            const pinMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            
            const pos = latLonToVector3(loc.lat, loc.lon, 81.2);
            pinMesh.position.copy(pos);
            pinMesh.userData = loc;
            
            scene.add(pinMesh);
            pins.push(pinMesh);
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pins);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('card-title').innerText = data.title;
                document.getElementById('card-desc').innerText = data.desc + " (Fiyat: " + data.price + ")";
                
                const statusEl = document.getElementById('card-status');
                if(data.status === "müsait") {
                    statusEl.innerText = "MÜSAİT - " + data.price;
                    statusEl.className = "status available";
                    document.getElementById('card-btn').innerText = "Bu Arsayı Kirala";
                } else {
                    statusEl.innerText = "KİRALANDI";
                    statusEl.className = "status taken";
                    document.getElementById('card-btn').innerText = "Detayları Gör";
                }

                document.getElementById('info-card').style.display = 'block';
            }
        });

        function contactParcel() {
            alert('Tebrikler! Bu arsayı kiralamak için rezervasyon talebiniz iletildi.');
        }

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.0008;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
