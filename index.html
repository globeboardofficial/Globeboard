<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeBoard - Küresel Reklam Platformu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #info-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 90%;
            width: 320px;
            display: none;
            backdrop-filter: blur(8px);
        }
        #info-card h3 { margin: 0 0 8px 0; color: #38bdf8; font-size: 1.1rem; }
        #info-card p { margin: 0 0 12px 0; font-size: 0.9rem; color: #cbd5e1; }
        #info-card button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-card">
        <h3 id="card-title">Sanal Arsa #1</h3>
        <p id="card-desc">Bu alan henüz kiralanmadı. Markanızı dünyaya tanıtmak için hemen yerinizi alın!</p>
        <button onclick="alert('Kirala/Satın Al mekanizması yakında aktif olacak!')">Arsayı İncele / Kirala</button>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Dünya Küresi
        const geometry = new THREE.SphereGeometry(80, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const material = new THREE.MeshPhongMaterial({ map: earthTexture });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Örnek Reklam / Arsa Noktaları (Pimler)
        const pins = [];
        const pinLocations = [
            { lat: 41.0082, lon: 28.9784, title: "İstanbul Parseli", desc: "Türkiye'nin kalbinde yer alan prestijli reklam alanı." },
            { lat: 40.7128, lon: -74.0060, title: "New York Parseli", desc: "Küresel finans merkezinde reklamınızı yayınlayın." },
            { lat: 35.6762, lon: 139.6503, title: "Tokyo Parseli", desc: "Teknoloji devlerinin merkezinde sanal arsa." }
        ];

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        pinLocations.forEach(loc => {
            const pinGeo = new THREE.SphereGeometry(2.5, 16, 16);
            const pinMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            
            const pos = latLonToVector3(loc.lat, loc.lon, 81);
            pinMesh.position.copy(pos);
            pinMesh.userData = loc;
            
            scene.add(pinMesh);
            pins.push(pinMesh);
        });

        // Tıklama Algılama
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pins);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                document.getElementById('card-title').innerText = data.title;
                document.getElementById('card-desc').innerText = data.desc;
                document.getElementById('info-card').style.display = 'block';
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            globe.rotation.y += 0.001;
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
