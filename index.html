<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeBoard - Küresel Sanal Arsa Platformu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        
        /* Bilgi Kartı */
        #info-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
            width: 320px;
            display: none;
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        #card-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #info-card h3 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.15rem; }
        #info-card .status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; }
        #info-card .status.available { background: #166534; color: #4ade80; }
        #info-card .status.taken { background: #991b1b; color: #fca5a5; }
        #info-card p { margin: 0 0 12px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.3; }
        #info-card button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        #info-card button:active { transform: scale(0.98); }

        /* İşlem Paneli */
        #action-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid #38bdf8;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            position: relative;
        }
        .modal-content h3 { margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
        .modal-content label { display: block; margin: 12px 0 4px 0; font-size: 0.85rem; color: #94a3b8; text-align: left; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        .file-upload-box {
            border: 2px dashed #0284c7;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            background: rgba(2, 132, 199, 0.05);
            margin-top: 6px;
            cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1;
        }
        .btn-cancel {
            background: #334155; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1;
        }
        .close-btn {
            position: absolute; top: 12px; right: 16px; font-size: 1.5rem; cursor: pointer; color: #94a3b8;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- Bilgi Kartı -->
    <div id="info-card">
        <img id="card-image" src="" alt="Reklam Alanı">
        <h3 id="card-title">Sanal Arsa</h3>
        <div id="card-status" class="status available">Müsait</div>
        <p id="card-desc">Arsa detayları burada görünecektir.</p>
        <button id="card-btn" onclick="openActionModal()">Hemen Kirala ve Reklam Yükle</button>
    </div>

    <!-- İşlem Paneli -->
    <div id="action-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeActionModal()">&times;</span>
            <h3 id="modal-title">Arsa Kiralama & Reklam Yayınlama</h3>
            <form id="directActionForm" onsubmit="processDirectAction(event)">
                <label>Reklam Görseli Yükleyin:</label>
                <div class="file-upload-box">
                    <input type="file" id="adImageFile" accept="image/*" required onchange="previewAdImage(event)">
                </div>
                
                <label>Yönlendirilecek Web Sitesi / Link (Opsiyonel):</label>
                <input type="url" id="adTargetUrl" placeholder="https://siteniz.com">

                <label>Reklam Başlığı / Marka Adı:</label>
                <input type="text" id="adTitle" required placeholder="Marka veya Firma Adı">

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeActionModal()">İptal</button>
                    <button type="submit" class="btn-action">Ödeme ve Anında Yayınla</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedParcel = null;
        let uploadedImageUrl = null;
        const labels = []; // Etiketleri takip etmek için dizi

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 240;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.minDistance = 90;  // Kürenin içine çok fazla girilmesini engeller
        controls.maxDistance = 350; // Dünyanın çok uzaklaşmasını engeller

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.path = new THREE.Vector3(5, 3, 5);
        scene.add(dirLight);

        // Dünya Küresi
        const geometry = new THREE.SphereGeometry(80, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const material = new THREE.MeshPhongMaterial({ map: earthTexture });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Şehir Veritabanı
        const pins = [];
        const pinLocations = [
            { id: 1, lat: 41.0082, lon: 28.9784, title: "İstanbul Boğaz Parseli", cityName: "İstanbul", desc: "Kıtaların buluştuğu küresel ticaret merkezi.", status: "müsait", price: "75 USD / Ay", image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=500&q=80" },
            { id: 2, lat: 39.9334, lon: 32.8597, title: "Ankara Merkez Parseli", cityName: "Ankara", desc: "Türkiye'nin siyasi ve idari kalbi.", status: "müsait", price: "40 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 3, lat: 38.4237, lon: 27.1428, title: "İzmir Kordon Parseli", cityName: "İzmir", desc: "Ege'nin incisi ticaret bölgesi.", status: "müsait", price: "50 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 4, lat: 36.8969, lon: 30.7133, title: "Antalya Sahil Parseli", cityName: "Antalya", desc: "Akdeniz'in turizm başkenti.", status: "müsait", price: "45 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 5, lat: 51.5074, lon: -0.1278, title: "Londra Finans Merkezi", cityName: "Londra", desc: "Avrupa'nın finans ve borsa kalbi.", status: "müsait", price: "90 USD / Ay", image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=500&q=80" },
            { id: 6, lat: 48.8566, lon: 2.3522, title: "Paris Moda Parseli", cityName: "Paris", desc: "Moda ve sanat merkezi.", status: "müsait", price: "85 USD / Ay", image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=500&q=80" },
            { id: 7, lat: 52.5200, lon: 13.4050, title: "Berlin Teknoloji Parseli", cityName: "Berlin", desc: "Avrupa'nın teknoloji üssü.", status: "müsait", price: "75 USD / Ay", image: "https://images.unsplash.com/photo-1560969184-10fe8719e047?w=500&q=80" },
            { id: 8, lat: 41.9028, lon: 12.4964, title: "Roma Tarih Parseli", cityName: "Roma", desc: "Tarih ve turizm odaklı küresel nokta.", status: "müsait", price: "65 USD / Ay", image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=500&q=80" },
            { id: 9, lat: 40.7128, lon: -74.0060, title: "New York Times Square", cityName: "New York", desc: "Dünyanın reklam ve finans merkezi.", status: "müsait", price: "120 USD / Ay", image: "https://images.unsplash.com/photo-1534430480872-3498386e7856?w=500&q=80" },
            { id: 10, lat: 34.0522, lon: -118.2437, title: "Los Angeles Medya Parseli", cityName: "Los Angeles", desc: "Eğlence ve sinema sektörü kalbi.", status: "müsait", price: "95 USD / Ay", image: "https://images.unsplash.com/photo-1580655653885-65763b2597d0?w=500&q=80" },
            { id: 11, lat: 35.6762, lon: 139.6503, title: "Tokyo Shibuya Parseli", cityName: "Tokyo", desc: "Asya'nın yüksek teknoloji bölgesi.", status: "müsait", price: "100 USD / Ay", image: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=500&q=80" },
            { id: 12, lat: 25.2048, lon: 55.2708, title: "Dubai Marina Parseli", cityName: "Dubai", desc: "Orta Doğu'nun lüks ve ticaret vitrini.", status: "müsait", price: "95 USD / Ay", image: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=500&q=80" },
            { id: 13, lat: -33.8688, lon: 151.2093, title: "Sidney Liman Parseli", cityName: "Sidney", desc: "Okyanusya'nın yaşam ve ticaret merkezi.", status: "müsait", price: "70 USD / Ay", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=500&q=80" },
            { id: 14, lat: 30.0444, lon: 31.2357, title: "Kahire Nil Parseli", cityName: "Kahire", desc: "Kuzey Afrika'nın kültürel kavşağı.", status: "müsait", price: "40 USD / Ay", image: "https://images.unsplash.com/photo-1572252009286-268acec5ca0a?w=500&q=80" }
        ];

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Küçültülmüş ve optimize edilmiş yazı sprite'ı
        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            context.font = 'Bold 20px Arial';
            const metrics = context.measureText(message);
            canvas.width = metrics.width + 16;
            canvas.height = 32;

            context.font = 'Bold 20px Arial';
            context.fillStyle = 'rgba(15, 23, 42, 0.9)';
            context.strokeStyle = 'rgba(56, 189, 248, 0.5)';
            context.lineWidth = 2;

            context.beginPath();
            context.roundRect(0, 0, canvas.width, canvas.height, 6);
            context.fill();
            context.stroke();

            context.fillStyle = '#38bdf8';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(spriteMaterial);
            
            // Çakışmayı önlemek için etiket boyutu küçültüldü (Örn: İstanbul, Ankara, İzmir yan yana sığabilir)
            sprite.scale.set(7.5, 3.75, 1);
            return sprite;
        }

        pinLocations.forEach(loc => {
            const pinGeo = new THREE.SphereGeometry(1.4, 16, 16);
            const colorHex = loc.status === "müsait" ? 0x22c55e : 0xef4444;
            const pinMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            
            const pos = latLonToVector3(loc.lat, loc.lon, 80.5);
            pinMesh.position.copy(pos);
            pinMesh.userData = loc;
            
            scene.add(pinMesh);
            pins.push(pinMesh);

            const labelSprite = createTextSprite(loc.cityName);
            const labelPos = latLonToVector3(loc.lat, loc.lon, 84.0);
            labelSprite.position.copy(labelPos);
            scene.add(labelSprite);
            labels.push({ sprite: labelSprite, lat: loc.lat, lon: loc.lon });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#info-card') || e.target.closest('#action-modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pins);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                selectedParcel = data;

                document.getElementById('card-title').innerText = data.title;
                document.getElementById('card-desc').innerText = data.desc + " (" + data.price + ")";
                document.getElementById('card-image').src = data.image;
                
                const statusEl = document.getElementById('card-status');
                const btnEl = document.getElementById('card-btn');

                if(data.status === "müsait") {
                    statusEl.innerText = "MÜSAİT - " + data.price;
                    statusEl.className = "status available";
                    btnEl.innerText = "Hemen Kirala ve Reklam Yükle";
                    btnEl.disabled = false;
                    btnEl.style.opacity = "1";
                } else {
                    statusEl.innerText = "KİRALANDI";
                    statusEl.className = "status taken";
                    btnEl.innerText = "Bu Arsa Dolu";
                    btnEl.disabled = true;
                    btnEl.style.opacity = "0.5";
                }

                document.getElementById('info-card').style.display = 'block';
            } else {
                document.getElementById('info-card').style.display = 'none';
            }
        });

        function openActionModal() {
            if (!selectedParcel || selectedParcel.status !== "müsait") return;
            document.getElementById('modal-title').innerText = selectedParcel.title + " - Reklam Ekle";
            document.getElementById('action-modal').style.display = 'flex';
        }

        function closeActionModal() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('directActionForm').reset();
            uploadedImageUrl = null;
        }

        function previewAdImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageUrl = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function processDirectAction(e) {
            e.preventDefault();
            const title = document.getElementById('adTitle').value;

            if (uploadedImageUrl) {
                selectedParcel.image = uploadedImageUrl;
            }
            selectedParcel.title = title;
            selectedParcel.status = "dolu";

            document.getElementById('card-title').innerText = selectedParcel.title;
            document.getElementById('card-image').src = selectedParcel.image;
            document.getElementById('card-status').innerText = "KİRALANDI";
            document.getElementById('card-status').className = "status taken";
            document.getElementById('card-btn').innerText = "Bu Arsa Dolu";
            document.getElementById('card-btn').disabled = true;
            document.getElementById('card-btn').style.opacity = "0.5";

            const targetPin = pins.find(p => p.userData.id === selectedParcel.id);
            if (targetPin) {
                targetPin.material.color.setHex(0xef4444);
            }

            alert("Tebrikler! Reklamınız başarıyla oluşturuldu ve arsa canlı olarak güncellendi.");
            closeActionModal();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Dinamik Etiket Gizleme/Ölçekleme (Kullanıcı uzaklaşınca yazıların birbirine girmesini önler)
            const cameraDistance = camera.position.length();
            
            labels.forEach(item => {
                // Kamera dünyadan çok uzaksa etiketleri küçült veya gizle, yaklaşınca netleştir
                const distToCam = item.sprite.position.distanceTo(camera.position);
                if (cameraDistance > 220) {
                    item.sprite.visible = false; // Çok uzaktayken etiketler kalabalık yapmasın
                } else {
                    item.sprite.visible = true;
                    // Yakınlık derecesine göre etiket boyutunu dinamik ayarla
                    let scaleFactor = Math.max(0.6, Math.min(1.2, 200 / cameraDistance));
                    item.sprite.scale.set(7.5 * scaleFactor, 3.75 * scaleFactor, 1);
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
