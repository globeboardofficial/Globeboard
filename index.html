<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeBoard - Küresel Sanal Arsa Platformu</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }
        
        /* 3D Küre Üzerindeki İsim Etiketleri */
        .pin-label {
            position: absolute;
            transform: translate(-50%, -120%);
            background: rgba(15, 23, 42, 0.85);
            color: #38bdf8;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            border: 1px solid rgba(56, 189, 248, 0.3);
            pointer-events: none;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: opacity 0.2s;
        }

        /* Bilgi Kartı */
        #info-card {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.94);
            color: #fff;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 90%;
            width: 320px;
            display: none;
            backdrop-filter: blur(12px);
            z-index: 10;
        }
        #card-image {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #info-card h3 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.15rem; }
        #info-card .status { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 8px; }
        #info-card .status.available { background: #166534; color: #4ade80; }
        #info-card .status.taken { background: #991b1b; color: #fca5a5; }
        #info-card p { margin: 0 0 12px 0; font-size: 0.85rem; color: #cbd5e1; line-height: 1.3; }
        #info-card button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }
        #info-card button:active { transform: scale(0.98); }

        /* Doğrudan İşlem Modal / Panel */
        #action-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f172a;
            border: 1px solid #38bdf8;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 420px;
            color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            position: relative;
        }
        .modal-content h3 { margin-top: 0; color: #38bdf8; font-size: 1.25rem; }
        .modal-content label { display: block; margin: 12px 0 4px 0; font-size: 0.85rem; color: #94a3b8; text-align: left; }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        .file-upload-box {
            border: 2px dashed #0284c7;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            background: rgba(2, 132, 199, 0.05);
            margin-top: 6px;
            cursor: pointer;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-action {
            background: linear-gradient(135deg, #0284c7, #0369a1); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1;
        }
        .btn-cancel {
            background: #334155; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1;
        }
        .close-btn {
            position: absolute; top: 12px; right: 16px; font-size: 1.5rem; cursor: pointer; color: #94a3b8;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <!-- Bilgi Kartı -->
    <div id="info-card">
        <img id="card-image" src="" alt="Reklam Alanı">
        <h3 id="card-title">Sanal Arsa</h3>
        <div id="card-status" class="status available">Müsait</div>
        <p id="card-desc">Arsa detayları burada görünecektir.</p>
        <button id="card-btn" onclick="openActionModal()">Hemen Kirala ve Reklam Yükle</button>
    </div>

    <!-- Doğrudan İşlem Paneli -->
    <div id="action-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeActionModal()">&times;</span>
            <h3 id="modal-title">Arsa Kiralama & Reklam Yayınlama</h3>
            <form id="directActionForm" onsubmit="processDirectAction(event)">
                <label>Reklam Görseli Yükleyin:</label>
                <div class="file-upload-box">
                    <input type="file" id="adImageFile" accept="image/*" required onchange="previewAdImage(event)">
                </div>
                
                <label>Yönlendirilecek Web Sitesi / Link (Opsiyonel):</label>
                <input type="url" id="adTargetUrl" placeholder="https://siteniz.com">

                <label>Reklam Başlığı / Marka Adı:</label>
                <input type="text" id="adTitle" required placeholder="Marka veya Firma Adı">

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeActionModal()">İptal</button>
                    <button type="submit" class="btn-action">Ödeme ve Anında Yayınla</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let selectedParcel = null;
        let uploadedImageUrl = null;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 240;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Dünya Küresi
        const geometry = new THREE.SphereGeometry(80, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        const material = new THREE.MeshPhongMaterial({ map: earthTexture });
        const globe = new THREE.Mesh(geometry, material);
        scene.add(globe);

        // Kapsamlı Küresel Parsel ve Şehir Veritabanı
        const pins = [];
        const labelElements = [];
        const pinLocations = [
            { id: 1, lat: 41.0082, lon: 28.9784, title: "İstanbul Boğaz Parseli", cityName: "İstanbul, Türkiye", desc: "Kıtaların buluştuğu küresel ticaret ve turizm merkezi.", status: "müsait", price: "75 USD / Ay", image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=500&q=80" },
            { id: 2, lat: 39.9334, lon: 32.8597, title: "Ankara Merkez Parseli", cityName: "Ankara, Türkiye", desc: "Türkiye'nin siyasi ve idari başkent kalbi.", status: "müsait", price: "40 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 3, lat: 38.4237, lon: 27.1428, title: "İzmir Kordon Parseli", cityName: "İzmir, Türkiye", desc: "Ege'nin incisi, ticaret ve liman bölgesi.", status: "müsait", price: "50 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 4, lat: 36.8969, lon: 30.7133, title: "Antalya Sahil Parseli", cityName: "Antalya, Türkiye", desc: "Akdeniz'in turizm ve tatil başkenti.", status: "müsait", price: "45 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 5, lat: 40.1828, lon: 29.0665, title: "Bursa Sanayi Parseli", cityName: "Bursa, Türkiye", desc: "Otomotiv ve sanayi merkezi.", status: "müsait", price: "35 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 6, lat: 37.0662, lon: 37.3833, title: "Gaziantep Ticaret Parseli", cityName: "Gaziantep, Türkiye", desc: "Güneydoğu'nun sanayi ve gastronomi merkezi.", status: "müsait", price: "30 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 7, lat: 40.9833, lon: 39.7276, title: "Trabzon Liman Parseli", cityName: "Trabzon, Türkiye", desc: "Karadeniz'in uluslararası ticaret kapısı.", status: "müsait", price: "30 USD / Ay", image: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?w=500&q=80" },
            { id: 8, lat: 51.5074, lon: -0.1278, title: "Londra Finans Merkezi", cityName: "Londra, İngiltere", desc: "Avrupa'nın finans ve borsa kalbi.", status: "müsait", price: "90 USD / Ay", image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=500&q=80" },
            { id: 9, lat: 48.8566, lon: 2.3522, title: "Paris Moda ve Sanat Parseli", cityName: "Paris, Fransa", desc: "Moda, sanat ve lüks tüketim merkezi.", status: "müsait", price: "85 USD / Ay", image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=500&q=80" },
            { id: 10, lat: 52.5200, lon: 13.4050, title: "Berlin Teknoloji Parseli", cityName: "Berlin, Almanya", desc: "Avrupa'nın startup ve teknoloji üssü.", status: "müsait", price: "75 USD / Ay", image: "https://images.unsplash.com/photo-1560969184-10fe8719e047?w=500&q=80" },
            { id: 11, lat: 41.9028, lon: 12.4964, title: "Roma Tarih Parseli", cityName: "Roma, İtalya", desc: "Tarih ve turizm odaklı küresel nokta.", status: "müsait", price: "65 USD / Ay", image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=500&q=80" },
            { id: 12, lat: 40.4168, lon: -3.7038, title: "Madrid Ticaret Parseli", cityName: "Madrid, İspanya", desc: "İspanya'nın ana ticaret ve iş merkezi.", status: "müsait", price: "60 USD / Ay", image: "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?w=500&q=80" },
            { id: 13, lat: 40.7128, lon: -74.0060, title: "New York Times Square", cityName: "New York, ABD", desc: "Dünyanın reklam ve finans merkezi.", status: "müsait", price: "120 USD / Ay", image: "https://images.unsplash.com/photo-1534430480872-3498386e7856?w=500&q=80" },
            { id: 14, lat: 34.0522, lon: -118.2437, title: "Los Angeles Hollywood Parseli", cityName: "Los Angeles, ABD", desc: "Eğlence, medya ve sinema sektörü kalbi.", status: "müsait", price: "95 USD / Ay", image: "https://images.unsplash.com/photo-1580655653885-65763b2597d0?w=500&q=80" },
            { id: 15, lat: 37.7749, lon: -122.4194, title: "San Francisco Silikon Vadisi", cityName: "San Francisco, ABD", desc: "Küresel teknoloji ve yazılım devi bölge.", status: "müsait", price: "110 USD / Ay", image: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29?w=500&q=80" },
            { id: 16, lat: 43.6532, lon: -79.3832, title: "Toronto Finans Parseli", cityName: "Toronto, Kanada", desc: "Kanada'nın ekonomik ve finansal merkezi.", status: "müsait", price: "70 USD / Ay", image: "https://images.unsplash.com/photo-1517090504586-fde19ea6066f?w=500&q=80" },
            { id: 17, lat: -23.5505, lon: -46.6333, title: "Sao Paulo İş Merkezi", cityName: "Sao Paulo, Brezilya", desc: "Güney Amerika'nın ticaret ve sanayi devi.", status: "müsait", price: "55 USD / Ay", image: "https://images.unsplash.com/photo-1543059080-f9b12722bc9d?w=500&q=80" },
            { id: 18, lat: 35.6762, lon: 139.6503, title: "Tokyo Shibuya Parseli", cityName: "Tokyo, Japonya", desc: "Asya'nın yüksek teknolojili reklam bölgesi.", status: "müsait", price: "100 USD / Ay", image: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=500&q=80" },
            { id: 19, lat: 31.2304, lon: 121.4737, title: "Şanghay Liman Parseli", cityName: "Şanghay, Çin", desc: "Dünyanın en büyük ticaret ve finans limanlarından biri.", status: "müsait", price: "90 USD / Ay", image: "https://images.unsplash.com/photo-1548919973-57551525e18c?w=500&q=80" },
            { id: 20, lat: 25.2048, lon: 55.2708, title: "Dubai Marina Parseli", cityName: "Dubai, BAE", desc: "Orta Doğu'nun lüks, ticaret ve turizm vitrini.", status: "müsait", price: "95 USD / Ay", image: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=500&q=80" },
            { id: 21, lat: 28.6139, lon: 77.2090, title: "Yeni Delhi Ticaret Parseli", cityName: "Yeni Delhi, Hindistan", desc: "Güney Asya'nın hızla büyüyen pazar merkezi.", status: "müsait", price: "60 USD / Ay", image: "https://images.unsplash.com/photo-1587474260584-136574528ed5?w=500&q=80" },
            { id: 22, lat: 1.3521, lon: 103.8198, title: "Singapur Finans Üssü", cityName: "Singapur", desc: "Güneydoğu Asya'nın teknoloji ve finans merkezi.", status: "müsait", price: "85 USD / Ay", image: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=500&q=80" },
            { id: 23, lat: -33.8688, lon: 151.2093, title: "Sidney Liman Parseli", cityName: "Sidney, Avustralya", desc: "Okyanusya'nın ticaret ve yaşam merkezi.", status: "müsait", price: "70 USD / Ay", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=500&q=80" },
            { id: 24, lat: 30.0444, lon: 31.2357, title: "Kahire Nil Parseli", cityName: "Kahire, Mısır", desc: "Kuzey Afrika'nın kültürel ve ticari kavşağı.", status: "müsait", price: "40 USD / Ay", image: "https://images.unsplash.com/photo-1572252009286-268acec5ca0a?w=500&q=80" },
            { id: 25, lat: -26.2041, lon: 28.0473, title: "Johannesburg Maden Parseli", cityName: "Johannesburg, Güney Afrika", desc: "Afrika'nın ekonomik ve finans başkenti.", status: "müsait", price: "45 USD / Ay", image: "https://images.unsplash.com/photo-1577948000119-2797b7b26102?w=500&q=80" }
        ];

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        pinLocations.forEach(loc => {
            const pinGeo = new THREE.SphereGeometry(3.5, 16, 16);
            const colorHex = loc.status === "müsait" ? 0x22c55e : 0xef4444;
            const pinMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const pinMesh = new THREE.Mesh(pinGeo, pinMat);
            
            const pos = latLonToVector3(loc.lat, loc.lon, 81.5);
            pinMesh.position.copy(pos);
            pinMesh.userData = loc;
            
            scene.add(pinMesh);
            pins.push(pinMesh);

            const labelDiv = document.createElement('div');
            labelDiv.className = 'pin-label';
            labelDiv.innerText = loc.cityName;
            container.appendChild(labelDiv);

            labelElements.push({ element: labelDiv, position: pos, mesh: pinMesh });
        });

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerup', (e) => {
            if (e.target.closest('#info-card') || e.target.closest('#action-modal')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pins);

            if (intersects.length > 0) {
                const data = intersects[0].object.userData;
                selectedParcel = data;

                document.getElementById('card-title').innerText = data.title;
                document.getElementById('card-desc').innerText = data.desc + " (" + data.price + ")";
                document.getElementById('card-image').src = data.image;
                
                const statusEl = document.getElementById('card-status');
                const btnEl = document.getElementById('card-btn');

                if(data.status === "müsait") {
                    statusEl.innerText = "MÜSAİT - " + data.price;
                    statusEl.className = "status available";
                    btnEl.innerText = "Hemen Kirala ve Reklam Yükle";
                    btnEl.disabled = false;
                    btnEl.style.opacity = "1";
                } else {
                    statusEl.innerText = "KİRALANDI";
                    statusEl.className = "status taken";
                    btnEl.innerText = "Bu Arsa Dolu";
                    btnEl.disabled = true;
                    btnEl.style.opacity = "0.5";
                }

                document.getElementById('info-card').style.display = 'block';
            }
        });

        function openActionModal() {
            if (!selectedParcel || selectedParcel.status !== "müsait") return;
            document.getElementById('modal-title').innerText = selectedParcel.title + " - Reklam Ekle";
            document.getElementById('action-modal').style.display = 'flex';
        }

        function closeActionModal() {
            document.getElementById('action-modal').style.display = 'none';
            document.getElementById('directActionForm').reset();
            uploadedImageUrl = null;
        }

        function previewAdImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageUrl = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function processDirectAction(e) {
            e.preventDefault();
            const title = document.getElementById('adTitle').value;

            if (uploadedImageUrl) {
                selectedParcel.image = uploadedImageUrl;
            }
            selectedParcel.title = title;
            selectedParcel.status = "dolu";

            document.getElementById('card-title').innerText = selectedParcel.title;
            document.getElementById('card-image').src = selectedParcel.image;
            document.getElementById('card-status').innerText = "KİRALANDI";
            document.getElementById('card-status').className = "status taken";
            document.getElementById('card-btn').innerText = "Bu Arsa Dolu";
            document.getElementById('card-btn').disabled = true;
            document.getElementById('card-btn').style.opacity = "0.5";

            const targetPin = pins.find(p => p.userData.id === selectedParcel.id);
            if (targetPin) {
                targetPin.material.color.setHex(0xef4444);
            }

            alert("Tebrikler! Reklamınız başarıyla oluşturuldu ve arsa canlı olarak güncellendi.");
            closeActionModal();
        }

        function updateLabels() {
            const tempVector = new THREE.Vector3();

            labelElements.forEach(item => {
                tempVector.copy(item.position);
                tempVector.project(camera);

                const vectorToPin = item.position.clone().normalize();
                const dot = vectorToPin.dot(camera.getWorldDirection(new THREE.Vector3()).negate());

                if (dot < -0.1) {
                    item.element.style.display = 'none';
                } else {
                    item.element.style.display = 'block';
                    const x = (tempVector.x *  .5 + .5) * window.innerWidth;
                    const y = (tempVector.y * -.5 + .5) * window.innerHeight;
                    item.element.style.left = `${x}px`;
                    item.element.style.top = `${y}px`;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            updateLabels();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
